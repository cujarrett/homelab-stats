name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Lint
        run: go vet ./...

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: cujarrett/homelab/.github/workflows/build-image.yml@main
    with:
      image: ghcr.io/cujarrett/homelab-stats
      tags: |
        ghcr.io/cujarrett/homelab-stats:main
        ghcr.io/cujarrett/homelab-stats:sha-${{ github.sha }}
      cache-scope: homelab-stats

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    uses: cujarrett/homelab-workspaces/.github/workflows/update-image-tag.yml@main
    with:
      namespace: mattjarrett-dev
    secrets:
      app_private_key: ${{ secrets.HOMELAB_WORKSPACES_APP_KEY }}
